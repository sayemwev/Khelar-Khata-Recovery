<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khelar Khata - Data Recovery & Generator</title>
    
    <!-- External Libraries (Same as your App) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --accent-gold: #ffd700;
            --accent-green: #2e7d32;
            --accent-red: #d32f2f;
            --text-main: #ffffff;
            --border: #333333;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px; /* Space for Ad below */
        }

        h2 {
            text-align: center;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        p {
            text-align: center;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #000;
            color: #0f0;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus {
            outline: 1px solid var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-paste { background: #2196F3; color: white; }
        .btn-clear { background: var(--accent-red); color: white; }
        .btn-pdf { background: #1565c0; color: white; }
        .btn-img { background: var(--accent-green); color: white; }
        
        button:active { transform: scale(0.98); opacity: 0.9; }

        .action-area {
            border-top: 1px solid var(--border);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Ad Container Styling */
        .ad-banner-area {
            margin: 20px auto;
            text-align: center;
            display: flex;
            justify-content: center;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        /* --- STYLES FOR IMAGE GENERATION (Copied from original) --- */
        #visual-capture {
            position: fixed;
            top: 0;
            left: -9999px;
            width: 600px;
            background: #121212;
            color: white;
            padding: 20px;
            font-family: 'Segoe UI', sans-serif;
            border: 2px solid #333;
        }
        .vc-header {
            background: #000;
            padding: 15px;
            color: #ffd700;
            text-align: center;
            border-bottom: 2px solid #333;
            margin-bottom: 10px;
        }
        .vc-team-card {
            background: #1e1e1e;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .vc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .vc-table th {
            background: #000;
            color: #aaa;
            padding: 5px;
            text-align: center;
        }
        .vc-table td {
            border-bottom: 1px solid #333;
            padding: 5px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Khelar Khata Recovery</h2>
        <p>Paste the code copied from the App below</p>

        <textarea id="inputData" placeholder='Paste your data here (starts with {"meta":... or {"id":...)'></textarea>

        <div class="btn-group">
            <button class="btn-paste" onclick="pasteData()">📋 Paste</button>
            <button class="btn-clear" onclick="clearData()">❌ Clear</button>
        </div>

        <div class="action-area">
            <button class="btn-pdf" onclick="processAndDownload('pdf')">📄 Download PDF</button>
            <button class="btn-img" onclick="processAndDownload('image')">🖼️ Download Image</button>
        </div>
        
        <div style="text-align: center; margin-top: 15px; font-size: 0.8rem; color: #666;">
            Developed by MD ABDUL HALIM SAYEM
        </div>
    </div>

    <!-- START: Banner Ad Placement (Centered below the main tool) -->
    <div class="ad-banner-area">
        <script type="text/javascript">
            atOptions = {
                'key' : 'cc4b534afa7dd620f4dcbe5096a3d501',
                'format' : 'iframe',
                'height' : 300,
                'width' : 160,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highperformanceformat.com/cc4b534afa7dd620f4dcbe5096a3d501/invoke.js"></script>
    </div>
    <!-- END: Banner Ad Placement -->

    <!-- Hidden Container for Image Generation -->
    <div id="visual-capture"></div>

    <script>
        // --- INPUT HANDLING ---

        async function pasteData() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('inputData').value = text;
            } catch (err) {
                alert('Failed to read clipboard. Please paste manually.');
            }
        }

        function clearData() {
            document.getElementById('inputData').value = '';
        }

        // --- PROCESSING ---

        function processAndDownload(type) {
            const raw = document.getElementById('inputData').value.trim();
            if (!raw) return alert("Please paste the data first!");

            try {
                const parsed = JSON.parse(raw);
                
                // Determine structure. 
                let match = null;
                let tournaments = []; 

                if (parsed.matchData) {
                    match = parsed.matchData;
                    if (parsed.fullBackup && parsed.fullBackup.tournaments) {
                        tournaments = parsed.fullBackup.tournaments;
                    }
                } else if (parsed.id && parsed.innings) {
                    match = parsed;
                }

                if (!match) throw new Error("Invalid Data Format");

                if (type === 'pdf') {
                    downloadMatchPDF(match, tournaments);
                } else {
                    downloadMatchImage(match);
                }

            } catch (e) {
                console.error(e);
                alert("Error processing data: Invalid JSON or corrupted data.");
            }
        }

        // --- IMAGE GENERATION LOGIC ---

        function downloadMatchImage(m) {
            let c = document.getElementById('visual-capture');
            
            // Build HTML
            c.innerHTML = `
            <div class="vc-header">
                <h2>${m.teams.host} vs ${m.teams.visitor}</h2>
                <p style="font-size:0.9rem; color:#ccc;">${m.result || 'In Progress'}</p>
                <p style="font-size:0.8rem; color:#888;">${m.date}</p>
            </div>`;

            m.innings.forEach(inn => {
                let html = `
                <div class="vc-team-card">
                    <h3 style="color:#a5d6a7; border-bottom:1px solid #444; padding-bottom:5px; margin-bottom:5px;">
                        ${inn.batTeam} &nbsp; ${inn.runs}/${inn.wickets} 
                        <span style="font-size:0.8em; color:#888;">(${Math.floor(inn.balls/6)}.${inn.balls%6} Ov)</span>
                    </h3>
                    <table class="vc-table">
                        <thead>
                            <tr>
                                <th style="text-align:left;">Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th>
                            </tr>
                        </thead>
                        <tbody>`;
                
                inn.batters.forEach(b => {
                    if (b.runs > 0 || b.balls > 0 || !b.isOut) {
                        html += `<tr>
                            <td style="text-align:left;">${b.name} ${!b.isOut && b.onStrike?'*':''}</td>
                            <td>${b.runs}</td>
                            <td>${b.balls}</td>
                            <td>${b.fours}</td>
                            <td>${b.sixes}</td>
                            <td>${b.balls>0?((b.runs/b.balls)*100).toFixed(0):'0'}</td>
                        </tr>`;
                    }
                });

                let extTotal = inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;
                let extDetail = `[Wd(${inn.extras.wd}), Nb(${inn.extras.nb}), Lb(${inn.extras.lb}), Byes(${inn.extras.b})]`;

                html += `</tbody></table>
                <div style="margin:10px 0; font-size:11px; color:#aaa; font-weight:bold;">Extras ${extTotal} ${extDetail}</div>
                
                <table class="vc-table">
                    <thead>
                        <tr>
                            <th style="text-align:left;">Bowler</th><th>O</th><th>R</th><th>W</th><th>Eco</th>
                        </tr>
                    </thead>
                    <tbody>`;

                let aggBowl = {};
                inn.bowlers.forEach(b => {
                    if (!aggBowl[b.name]) aggBowl[b.name] = { name: b.name, runs: 0, wickets: 0, balls: 0 };
                    aggBowl[b.name].runs += b.runs;
                    aggBowl[b.name].wickets += b.wickets;
                    aggBowl[b.name].balls += b.balls;
                });

                Object.values(aggBowl).forEach(b => {
                    let bo = b.balls;
                    let eco = bo > 0 ? (b.runs / (bo / 6)).toFixed(2) : '0.00';
                    html += `<tr>
                        <td style="text-align:left;">${b.name}</td>
                        <td>${Math.floor(bo/6)}.${bo%6}</td>
                        <td>${b.runs}</td>
                        <td>${b.wickets}</td>
                        <td>${eco}</td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
                c.innerHTML += html;
            });

            c.innerHTML += `<div style="text-align:center; margin-top:10px; font-size:10px; color:#555;">Generated By MD ABDUL HALIM SAYEM</div>`;

            html2canvas(c, { backgroundColor: "#121212", scale: 2 }).then(canvas => {
                let link = document.createElement('a');
                link.download = `scorecard_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }).catch(err => alert("Image generation failed"));
        }

        // --- PDF GENERATION LOGIC ---

        function downloadMatchPDF(m, tournaments) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const addFooter = () => {
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(100, 100, 100);
                    let footerText = `Generated: ${new Date().toLocaleString()} | Generated By MD. ABDUL HALIM SAYEM | Page ${i}`;
                    doc.text(footerText, 105, 290, null, null, 'center');
                }
            };

            const drawHeader = () => {
                doc.setFontSize(18);
                doc.setTextColor(0, 0, 0);
                doc.text(`${m.teams.host} vs ${m.teams.visitor}`, 105, 15, null, null, 'center');
                doc.setFontSize(12);
                doc.text(`Result: ${m.result || 'In Progress'}`, 105, 22, null, null, 'center');
                doc.setFontSize(10);
                doc.text(`Date: ${m.date}`, 105, 27, null, null, 'center');
            };

            m.innings.forEach((inn, index) => {
                if (index > 0) doc.addPage();
                drawHeader();

                let yPos = 35;
                doc.setFillColor(30, 30, 30);
                doc.rect(14, yPos, 182, 8, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(12);
                doc.text(`${inn.batTeam}  ${inn.runs}/${inn.wickets} (${Math.floor(inn.balls/6)}.${inn.balls%6}) - Innings ${index + 1}`, 16, yPos + 6);
                yPos += 12;

                let batData = [];
                inn.batters.forEach(b => {
                    let outText = 'Not Out';
                    if (b.isOut) {
                        let bowlerText = b.wicketTaker ? ` b ${b.wicketTaker}` : '';
                        if (b.howOut === 'caught') outText = `c ${b.wicketFielder || 'Sub'}${bowlerText}`;
                        else if (b.howOut === 'bowled') outText = `b ${b.wicketTaker}`;
                        else if (b.howOut === 'lbw') outText = `lbw${bowlerText}`;
                        else if (b.howOut === 'stumped') outText = `st ${b.wicketFielder || 'WK'}${bowlerText}`;
                        else if (b.howOut === 'runout') outText = `Run Out (${b.wicketFielder || ''})`;
                        else outText = b.howOut + bowlerText;
                    } else if (b.retired) {
                        outText = 'Retired Hurt';
                    }
                    batData.push([
                        b.name + (b.isOut ? '' : '*'), 
                        b.runs, b.balls, b.fours, b.sixes, 
                        b.balls > 0 ? ((b.runs/b.balls)*100).toFixed(1) : '0.0', 
                        outText
                    ]);
                });

                doc.autoTable({
                    startY: yPos,
                    head: [['Batter', 'R', 'B', '4s', '6s', 'SR', 'Out']],
                    body: batData,
                    theme: 'grid',
                    headStyles: { fillColor: [46, 125, 50] },
                    styles: { fontSize: 8, cellPadding: 2 }
                });

                yPos = doc.lastAutoTable.finalY + 5;
                let extTotal = inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(10);
                doc.text(`Extras: ${extTotal} [Wd(${inn.extras.wd}), Nb(${inn.extras.nb}), Lb(${inn.extras.lb}), Byes(${inn.extras.b})]`, 14, yPos);
                yPos += 8;

                let aggBowl = {};
                inn.bowlers.forEach(b => {
                    if (!aggBowl[b.name]) aggBowl[b.name] = { name: b.name, runs: 0, wickets: 0, balls: 0 };
                    aggBowl[b.name].runs += b.runs;
                    aggBowl[b.name].wickets += b.wickets;
                    aggBowl[b.name].balls += b.balls;
                });
                let bowlData = [];
                Object.values(aggBowl).forEach(b => {
                    let bo = b.balls;
                    let eco = bo > 0 ? (b.runs / (bo / 6)).toFixed(2) : '0.00';
                    bowlData.push([b.name, `${Math.floor(bo/6)}.${bo%6}`, b.runs, b.wickets, eco]);
                });

                doc.autoTable({
                    startY: yPos,
                    head: [['Bowler', 'O', 'R', 'W', 'Eco']],
                    body: bowlData,
                    theme: 'grid',
                    headStyles: { fillColor: [21, 101, 192] },
                    styles: { fontSize: 8, cellPadding: 2 }
                });
            });

            let t = m.tournamentData;
            if (!t && m.tid && tournaments.length > 0) {
                t = tournaments.find(x => String(x.id) === String(m.tid));
            }

            if (t) {
                doc.addPage();
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(16);
                doc.text("Tournament Overview", 105, 20, null, null, 'center');
                
                let sorted = [...t.teams].sort((a,b) => {
                    if(b.stats.pts !== a.stats.pts) return b.stats.pts - a.stats.pts;
                    return b.stats.nrr - a.stats.nrr;
                });
                let ptData = sorted.map(tm => [tm.name, tm.stats.p, tm.stats.w, tm.stats.l, tm.stats.d, tm.stats.pts, tm.stats.nrr.toFixed(3)]);
                
                doc.setFontSize(12);
                doc.text("Points Table", 14, 30);
                doc.autoTable({
                    startY: 35,
                    head: [['Team', 'P', 'W', 'L', 'D', 'Pts', 'NRR']],
                    body: ptData,
                    theme: 'striped',
                    headStyles: { fillColor: [0, 0, 0] }
                });

                let yStat = doc.lastAutoTable.finalY + 15;
                let allPlayers = [];
                t.teams.forEach(tm => {
                    tm.players.forEach(p => allPlayers.push({...p, team:tm.name}));
                });

                let topBats = [...allPlayers].sort((a,b)=>(b.stats?.runs||0)-(a.stats?.runs||0)).slice(0,10);
                let batBody = topBats.map((p,i) => [i+1, p.name, p.team, p.stats?.matches||0, p.stats?.runs||0]);
                
                doc.text("Top Run Scorers", 14, yStat);
                doc.autoTable({
                    startY: yStat + 5,
                    head: [['#', 'Name', 'Team', 'Mat', 'Runs']],
                    body: batBody,
                    theme: 'grid',
                    headStyles: { fillColor: [46, 125, 50] },
                    tableWidth: 80,
                    margin: { left: 14 }
                });

                let topBowls = [...allPlayers].sort((a,b)=>(b.stats?.wickets||0)-(a.stats?.wickets||0)).slice(0,10);
                let bowlBody = topBowls.map((p,i) => [i+1, p.name, p.team, p.stats?.matches||0, p.stats?.wickets||0]);
                
                doc.text("Top Wicket Takers", 110, yStat);
                doc.autoTable({
                    startY: yStat + 5,
                    head: [['#', 'Name', 'Team', 'Mat', 'Wkts']],
                    body: bowlBody,
                    theme: 'grid',
                    headStyles: { fillColor: [21, 101, 192] },
                    tableWidth: 80,
                    margin: { left: 110 }
                });
            }

            doc.addPage();
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(16);
            doc.text("Detailed Ball by Ball Analysis", 105, 20, null, null, 'center');
            let logY = 30;

            m.innings.forEach((inn, index) => {
                doc.setFontSize(12);
                doc.setTextColor(46, 125, 50);
                doc.text(`Innings ${index + 1}: ${inn.batTeam}`, 14, logY);
                logY += 5;

                let balls = inn.recentBalls || inn.fullLog || [];
                
                if (balls.length > 0) {
                    let sortedBalls = [...balls].sort((a, b) => (a.over - b.over));
                    let logData = [];
                    let lastOverIndex = -1;
                    let lastBowlerName = "";
                    let legalBallCount = 0;
                    let extraSeq = 0;

                    sortedBalls.forEach(b => {
                        if (b.over !== lastOverIndex) {
                            logData.push([{
                                content: `Start of Over ${b.over + 1} - Bowler: ${b.bowler.toUpperCase()}`,
                                colSpan: 5,
                                styles: { fillColor: [220, 220, 220], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                            }]);
                            legalBallCount = 0; extraSeq = 0; lastOverIndex = b.over; lastBowlerName = b.bowler;
                        } 
                        else if (b.bowler !== lastBowlerName) {
                            logData.push([{
                                content: `Over ${b.over}.${legalBallCount} - Bowler: ${b.bowler.toUpperCase()}`,
                                colSpan: 5,
                                styles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold', halign: 'center' }
                            }]);
                            lastBowlerName = b.bowler;
                        }

                        let overDisplay = parseInt(b.over);
                        let ballLabel = "";
                        if (b.isLegal) {
                            legalBallCount++;
                            extraSeq = 0;
                            ballLabel = `${overDisplay}.${legalBallCount}`;
                        } else {
                            extraSeq++;
                            ballLabel = `${overDisplay}.${legalBallCount}.${extraSeq}`;
                        }

                        let desc = `${b.bowler} to ${b.batter}`;
                        let batterInfo = b.batter;
                        let teamInfo = "";
                        let outcome = b.display;

                        if (b.snapshot) {
                            batterInfo = `${b.batter} (${b.snapshot.batterRuns}/${b.snapshot.batterBalls})`;
                            teamInfo = `${b.snapshot.teamScore}/${b.snapshot.teamWickets}`;
                            if(b.isWicket && b.snapshot.howOut) outcome += ` (${b.snapshot.howOut})`;
                        }

                        logData.push([ballLabel, desc, batterInfo, teamInfo, outcome, b.isSwap]);
                    });

                    doc.autoTable({
                        startY: logY,
                        head: [['Ov', 'Bowler to Batter', 'Batter Stats', 'Score', 'Result']],
                        body: logData.map(r => r.slice(0, 5)),
                        theme: 'grid',
                        headStyles: { fillColor: [80, 80, 80] },
                        styles: { fontSize: 8, cellPadding: 2 },
                        columnStyles: { 0: { cellWidth: 15, fontStyle: 'bold' }, 4: { cellWidth: 30, fontStyle: 'bold', halign: 'center' } },
                        didParseCell: function(data) {
                            if (data.section === 'body') {
                                let rowRaw = logData[data.row.index];
                                if(rowRaw.length > 1 && rowRaw[5] === true) {
                                    data.cell.styles.fillColor = [123, 31, 162];
                                    data.cell.styles.textColor = [255, 255, 255];
                                }
                            }
                        }
                    });
                    logY = doc.lastAutoTable.finalY + 15;
                }
            });

            addFooter();
            doc.save(`scorecard_${Date.now()}.pdf`);
        }
    </script>
